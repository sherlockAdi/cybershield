name: Security and recovery checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
  linux-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - run: go test ./...
        working-directory: agents/linux-agent
      - run: mkdir -p artifacts/linux-amd64
      - run: go vet ./...
        working-directory: agents/linux-agent
      - run: go test -run '^$' -fuzz FuzzEventFileImportIsAtomic -fuzztime=10s -parallel=2
        working-directory: agents/linux-agent
      - run: go build -trimpath -o ../../artifacts/linux-amd64/serverguard-agent .
        working-directory: agents/linux-agent
  windows-agent:
    runs-on: windows-latest
    env:
      RUN_NATIVE_AGENT_TESTS: '1'
      GO_BINARY: go
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: pnpm install --frozen-lockfile
      - run: dotnet restore agents/windows-agent/ServerGuard.Agent.csproj --configfile agents/windows-agent/NuGet.Config
      - run: dotnet build agents/windows-agent/ServerGuard.Agent.csproj --no-restore --configuration Release
      - run: go test ./...
        working-directory: agents/linux-agent
      - run: node scripts/run.mjs test
