name: Security and recovery checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
  linux-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - run: go test ./...
        working-directory: agents/linux-agent
      - run: python3 -m unittest discover -s agents/management -p 'test_*.py'
      - run: mkdir -p artifacts/linux-amd64
      - run: go vet ./...
        working-directory: agents/linux-agent
      - run: go test -run '^$' -fuzz FuzzEventFileImportIsAtomic -fuzztime=10s -parallel=2
        working-directory: agents/linux-agent
      - run: go build -trimpath -o ../../artifacts/linux-amd64/serverguard-agent .
        working-directory: agents/linux-agent
  windows-agent:
    runs-on: windows-latest
    env:
      RUN_NATIVE_AGENT_TESTS: '1'
      GO_BINARY: go
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: pnpm install --frozen-lockfile
      - run: dotnet restore agents/windows-agent/ServerGuard.Agent.csproj --configfile agents/windows-agent/NuGet.Config
      - run: dotnet build agents/windows-agent/ServerGuard.Agent.csproj --no-restore --configuration Release
      - run: go test ./...
        working-directory: agents/linux-agent
      - run: node scripts/run.mjs test
  deploy:
    name: Deploy frontend backend and migrations
    needs: [verify, linux-agent, windows-agent]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: cybershield-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://cybershield360.vvvitsolutions.online
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure pinned SSH connection
        env:
          DEPLOY_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/cybershield_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/cybershield_deploy" "$HOME/.ssh/known_hosts"
      - name: Deploy exact checked commit
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "Skipping superseded commit $GITHUB_SHA"
            exit 0
          fi
          git archive --format=tar HEAD > "$RUNNER_TEMP/release.tar"
          ssh -T -i "$HOME/.ssh/cybershield_deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "root@$DEPLOY_HOST" "deploy $GITHUB_SHA" < "$RUNNER_TEMP/release.tar"
      - name: Remove temporary SSH key
        if: always()
        run: rm -f "$HOME/.ssh/cybershield_deploy"
