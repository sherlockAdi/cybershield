server {
    listen 80;
    server_name cybershield360.vvvitsolutions.online api.cybershield360.vvvitsolutions.online agent1.cybershield360.vvvitsolutions.online agent2.cybershield360.vvvitsolutions.online;
    location ^~ /.well-known/acme-challenge/ { root /var/www/cybershield360-acme; }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name cybershield360.vvvitsolutions.online;
    ssl_certificate /etc/letsencrypt/live/cybershield360-managed/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cybershield360-managed/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 80k;
    add_header X-Content-Type-Options nosniff always;
    location / {
        proxy_pass http://127.0.0.1:13100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
server {
    listen 443 ssl;
    server_name api.cybershield360.vvvitsolutions.online;
    ssl_certificate /etc/letsencrypt/live/cybershield360-managed/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cybershield360-managed/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 80k;
    location /api/ {
        proxy_pass http://127.0.0.1:14100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / { return 404; }
}
server {
    listen 443 ssl;
    server_name agent1.cybershield360.vvvitsolutions.online agent2.cybershield360.vvvitsolutions.online;
    ssl_certificate /etc/letsencrypt/live/cybershield360-managed/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cybershield360-managed/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 80k;
    location = /api/health { proxy_pass http://127.0.0.1:14100; }
    location ~ ^/api/agent/v1/(enroll|heartbeat|events)$ {
        proxy_pass http://127.0.0.1:14100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / { return 404; }
}
